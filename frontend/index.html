<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Taxi Fare Predictor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚖 NYC Taxi Fare Predictor</h1>
            <p>Get instant fare estimates for your NYC taxi rides</p>
        </header>

        <main>
            <!-- API Health Check Section -->
            <section class="card">
                <h2>🔧 API Status</h2>
                <button onclick="testHealthCheck()" class="btn btn-secondary">
                    Check API Health
                </button>
                <div id="healthResult" class="result" style="display: none;"></div>
            </section>

            <!-- Fare Prediction Section -->
            <section class="card">
                <h2>📍 Plan Your Trip</h2>
                
                <form class="trip-form" onsubmit="predictFare(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pickupLocation">
                                <span class="icon">📍</span>
                                Pickup Location
                            </label>
                            <select id="pickupLocation" required>
                                <option value="">Select pickup location...</option>
                                <!-- Options will be populated by JavaScript -->
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="dropoffLocation">
                                <span class="icon">🎯</span>
                                Dropoff Location
                            </label>
                            <select id="dropoffLocation" required>
                                <option value="">Select dropoff location...</option>
                                <!-- Options will be populated by JavaScript -->
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="passengerCount">
                                <span class="icon">👥</span>
                                Passengers
                            </label>
                            <select id="passengerCount" required>
                                <option value="1-4">1-4 Passengers (Small Group)</option>
                                <option value="4-7">4-7 Passengers (Large Group)</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="pickupTime">
                                <span class="icon">🕐</span>
                                Pickup Time
                            </label>
                            <input type="time" id="pickupTime" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        🚖 Get Fare Estimate
                    </button>
                </form>

                <div id="predictionResult" class="result" style="display: none;"></div>
            </section>

            <!-- Quick Estimates Section -->
            <section class="card">
                <h2>⚡ Quick Estimates</h2>
                <div class="quick-estimates">
                    <button onclick="quickEstimate('JFK', 'Manhattan')" class="btn btn-outline">
                        JFK ↔ Manhattan
                    </button>
                    <button onclick="quickEstimate('LGA', 'Manhattan')" class="btn btn-outline">
                        LGA ↔ Manhattan
                    </button>
                    <button onclick="quickEstimate('Manhattan', 'Brooklyn')" class="btn btn-outline">
                        Manhattan ↔ Brooklyn
                    </button>
                    <button onclick="quickEstimate('Times Square', 'Central Park')" class="btn btn-outline">
                        Times Square ↔ Central Park
                    </button>
                </div>
                <div id="quickEstimateResult" class="result" style="display: none;"></div>
            </section>
        </main>

        <footer>
            <p>🤖 Powered by Machine Learning | NYC Taxi Fare Prediction Model</p>
            <p>Note: Estimates are based on historical data and may vary from actual fares</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
